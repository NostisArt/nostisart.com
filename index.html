<title>Nostis Art</title>
<meta name="claude:viewport-fit-sides" content="cover">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Jost:wght@200;300;400&display=swap">

<style>
  :root {
    --bg: #1c1a16;
    --fg: #f5f0ea;
    --fg-dim: rgba(245, 240, 234, 0.75);
    --btn-border: rgba(245, 240, 234, 0.55);
    --btn-hover: rgba(245, 240, 234, 0.12);
    --header-line: rgba(245, 240, 234, 0.15);
    --footer-line: rgba(245, 240, 234, 0.25);
    color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--fg);
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
  }

  .scene {
    position: fixed;
    inset: 0;
    z-index: 0;
    overflow: hidden;
  }

  .scene-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center 30%;
    display: block;
  }

  .scene-scrim {
    position: absolute;
    inset: 0;
    background:
      linear-gradient(
        to top,
        rgba(10, 8, 6, 0.88) 0%,
        rgba(10, 8, 6, 0.60) 30%,
        rgba(10, 8, 6, 0.22) 58%,
        rgba(10, 8, 6, 0.06) 100%
      );
  }

  .page {
    position: relative;
    z-index: 1;
    min-height: 100%;
    display: flex;
    flex-direction: column;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: max(28px, env(safe-area-inset-top, 0px)) max(28px, env(safe-area-inset-bottom, 0px));
  }

  /* Header with bottom separator bar */
  .header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-inline: clamp(24px, 4vw, 72px);
    padding-bottom: 18px;
    border-bottom: 1px solid var(--header-line);
  }

  .logo {
    font-family: 'DM Serif Display', 'Georgia', serif;
    font-size: clamp(1.05rem, 2vw, 1.4rem);
    font-weight: 400;
    font-style: normal;
    letter-spacing: 0.02em;
    color: var(--fg);
    text-decoration: none;
  }

  .location {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.58rem, 0.9vw, 0.7rem);
    font-weight: 200;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  /* Hero: vertically centered, pushed slightly toward middle */
  .hero {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding-inline: clamp(24px, 4vw, 72px);
    padding-bottom: clamp(32px, 6vh, 60px);
  }

  .tagline {
    font-family: 'DM Serif Display', 'Georgia', serif;
    font-size: clamp(2.4rem, 6vw, 4.8rem);
    font-weight: 400;
    font-style: italic;
    line-height: 1.10;
    letter-spacing: -0.02em;
    color: var(--fg);
    text-wrap: balance;
    max-width: 14ch;
    margin-bottom: clamp(12px, 2vh, 22px);
  }

  .subline {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.8rem, 1.2vw, 0.92rem);
    font-weight: 200;
    line-height: 1.7;
    letter-spacing: 0.02em;
    color: var(--fg-dim);
    max-width: 42ch;
    margin-bottom: clamp(24px, 4vh, 40px);
  }

  .btn {
    display: inline-block;
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-size: clamp(0.65rem, 0.9vw, 0.74rem);
    font-weight: 300;
    letter-spacing: 0.20em;
    text-transform: uppercase;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--btn-border);
    padding: 12px 28px;
    text-decoration: none;
    transition: background 0.2s ease;
    cursor: pointer;
    align-self: flex-start;
  }

  .btn:hover, .btn:focus-visible {
    background: var(--btn-hover);
    outline: none;
  }

  .footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding-inline: clamp(24px, 4vw, 72px);
    padding-top: 18px;
    border-top: 1px solid var(--footer-line);
    gap: 12px;
    flex-wrap: wrap;
  }

  .footer-status {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.62rem;
    font-weight: 300;
    letter-spacing: 0.24em;
    text-transform: uppercase;
    color: var(--fg-dim);
  }

  .footer-email {
    font-family: 'Jost', 'Helvetica Neue', Arial, sans-serif;
    font-size: 0.68rem;
    font-weight: 300;
    letter-spacing: 0.08em;
    color: var(--fg-dim);
    text-decoration: none;
    transition: color 0.2s;
  }

  .footer-email:hover { color: var(--fg); }

  @media (max-width: 480px) {
    .scene-img { object-position: 55% 30%; }
    .tagline { max-width: 100%; }
    .subline { max-width: 100%; }
    .footer { flex-direction: column; align-items: flex-start; gap: 6px; }
  }
</style>

<div class="scene" aria-hidden="true">
  <img class="scene-img" src="./painting.jpg" alt="" loading="eager" decoding="async">
  <div class="scene-scrim"></div>
</div>

<div class="page">
  <header class="header">
    <a class="logo" href="#">Nostis Art</a>
    <span class="location">Central Valley, California</span>
  </header>

  <main class="hero">
    <h1 class="tagline">Curated artwork for commercial and residential spaces</h1>
    <p class="subline">We help restaurants, hotels, offices and private residences find art that belongs.</p>
    <a class="btn" href="mailto:studio@nostisart.com">Get in touch</a>
  </main>

  <footer class="footer">
    <span class="footer-status">Coming Soon</span>
    <a class="footer-email" href="mailto:studio@nostisart.com">studio@nostisart.com</a>
  </footer>
</div>
